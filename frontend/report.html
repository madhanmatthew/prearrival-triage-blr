<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report an Emergency</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Report an emergency</h1>
  <nav><a href="index.html">Home</a><a class="active" href="report.html">Report</a><a href="dispatch.html">Dispatcher</a><a href="police.html">Police</a><a href="hospital.html">Hospital</a></nav>
  <span class="disclaimer">Research prototype, not a medical device. In a real emergency call 108.</span>
</header>
<main style="max-width:760px">
  <!-- Step 1: language + location + report -->
  <div class="panel" id="start">
    <h2>1 · Language and location</h2>
    <div class="row">
      <button class="big lang" data-lang="en">English</button>
      <button class="big lang" data-lang="hi">हिन्दी</button>
      <button class="big lang" data-lang="kn">ಕನ್ನಡ</button>
    </div>
    <p class="muted" id="gpsInfo">Location: waiting for device GPS…</p>
    <details class="muted"><summary>Demo: set location manually</summary>
      <div class="row"><input id="lat" placeholder="lat" style="width:140px"><input id="lon" placeholder="lon" style="width:140px">
      <button id="silk">Silk Board (demo)</button></div>
    </details>
    <h2 style="margin-top:16px">2 · What happened?</h2>
    <div class="row">
      <button class="primary big" id="rec">🎤 Tap to speak</button>
      <span class="muted" id="recInfo"></span>
    </div>
    <label>…or type it</label>
    <textarea id="text" rows="3" placeholder="e.g. bike accident on the ORR, one person bleeding a lot"></textarea>
    <div class="row" style="margin-top:8px"><button class="primary" id="send">Send report</button></div>
    <p class="error" id="startErr"></p>
  </div>

  <!-- Step 2: dialogue -->
  <div class="panel" id="dialogue" hidden>
    <h2>Questions <span class="muted" id="iid"></span></h2>
    <p class="muted" id="transcript"></p>
    <p id="s3"></p>
    <div class="question" id="qtext"></div>
    <div class="row" id="taps">
      <button class="big tap" data-a="yes">Yes</button>
      <button class="big tap" data-a="no">No</button>
      <button class="big tap" data-a="don't know">Don't know</button>
    </div>
    <div class="row" id="free" hidden style="margin-top:8px">
      <input id="answer" placeholder="type your answer"><button class="primary" id="sendAnswer">Send</button>
    </div>
    <p class="error" id="dlgErr"></p>
  </div>

  <!-- Step 3: result + guidance -->
  <div class="panel" id="result" hidden>
    <h2>Report sent</h2>
    <p>Severity estimate: <span id="sev"></span> <span class="muted" id="model"></span></p>
    <p id="s1"></p>
    <p id="s2" hidden></p>
  </div>
  <div class="panel" id="guidance" hidden>
    <h2>First-aid steps <span id="grounded"></span></h2>
    <p id="s4"></p>
    <div id="steps"></div>
    <div class="row" style="margin-top:8px">
      <button id="prev">◀ Back</button><button id="repeat">🔊 Repeat</button><button class="primary" id="next">Next ▶</button>
      <span class="muted" id="speakInfo"></span>
    </div>
    <p class="source" id="sources"></p>
  </div>
</main>
<script src="common.js"></script>
<script>
let lang = "en", gps = null, incident = null, steps = [], stepIdx = 0;
const $ = (s) => document.querySelector(s);
const FREE_TEXT = new Set(["Q_NUM_INJURED", "Q_MECHANISM"]);
// Fixed status lines (docs/NATIVE_SPEAKER_TASKS.md Part B); hi/kn translated by native speakers.
const STATUS = {
  en: { s1: "Help is on the way. Stay with the person if it is safe.",
        s2: "An ambulance has been sent.",
        s3: "Please answer a few quick questions.",
        s4: "Follow these first-aid steps until help arrives." },
  hi: { s1: "मदद आ रही है। अगर सुरक्षित है, तो उस व्यक्ति के पास ही रहें।",
        s2: "एम्बुलेंस भेज दी गई है।",
        s3: "बस कुछ छोटे-छोटे सवालों के जवाब दे दीजिए।",
        s4: "मदद पहुँचने तक ये first-aid के तरीके अपनाइए।" },
  kn: { s1: "ಸಹಾಯ ಬರುತ್ತಿದೆ. ನಿಮಗೆ ಸುರಕ್ಷಿತವಾಗಿದ್ದರೆ, ಆ ವ್ಯಕ್ತಿಯ ಜೊತೆಯಲ್ಲೇ ಇರಿ.",
        s2: "ಆಂಬ್ಯುಲೆನ್ಸ್ ಕಳಿಸಲಾಗಿದೆ.",
        s3: "ದಯವಿಟ್ಟು ಕೆಲವು ಚಿಕ್ಕ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರ ಕೊಡಿ.",
        s4: "ಸಹಾಯ ಬರುವವರೆಗೂ ಈ first-aid ಕ್ರಮಗಳನ್ನು ಅನುಸರಿಸಿ." },
};
const st = (k) => STATUS[lang][k];
// recorded prompt file per question (data/prompts_audio/<key>_<lang>.mp3, served at /prompts/)
const QKEY = { Q_CONSCIOUS: "q1", Q_BREATHING: "q2", Q_BLEEDING: "q3", Q_SPEAK: "q4",
               Q_NUM_INJURED: "q5", Q_MECHANISM: "q6" };
let firstTurn = true;

// --- language ---
document.querySelectorAll(".lang").forEach((b) => b.onclick = () => {
  lang = b.dataset.lang;
  document.querySelectorAll(".lang").forEach((x) => x.classList.toggle("primary", x === b));
});
document.querySelector('.lang[data-lang="en"]').classList.add("primary");

// --- location: device GPS only (rule 5); manual entry is a labelled demo override ---
function setGps(lat, lon, src) {
  gps = { lat, lon }; $("#gpsInfo").textContent = `Location (${src}): ${lat.toFixed(5)}, ${lon.toFixed(5)}`;
  if (pendingVoice) { const b = pendingVoice; pendingVoice = null; sendVoice(b); }   // recording made before location was set
}
const GPS_ERR = { 1: "permission denied (allow location for this site, and Windows Settings → Privacy → Location)",
                  2: "position unavailable", 3: "timed out" };
function locate() {
  if (!window.isSecureContext) { gpsFailed("needs http://localhost:8000 (browsers block GPS and mic on other http addresses)"); return; }
  if (!navigator.geolocation) { gpsFailed("not supported by this browser"); return; }
  $("#gpsInfo").textContent = "Location: waiting for device GPS…";
  // Laptops have no GPS chip: the browser falls back to a Wi-Fi/IP estimate that can be km off,
  // so show the reported accuracy and flag coarse fixes instead of calling them "GPS".
  navigator.geolocation.getCurrentPosition((p) => {
    const acc = Math.round(p.coords.accuracy);
    const coarse = acc > 200;
    setGps(p.coords.latitude, p.coords.longitude,
           coarse ? `approximate, ±${acc >= 1000 ? (acc / 1000).toFixed(1) + " km" : acc + " m"}, Wi-Fi/IP estimate, not GPS`
                  : `device GPS, ±${acc} m`);
    if (coarse) {
      $("#gpsInfo").innerHTML += ` <span class="error">If this is wrong, use the demo override below.</span>`;
      document.querySelector("details").open = true;
    }
  },
    (e) => gpsFailed(GPS_ERR[e.code] || e.message), { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 });
}
function gpsFailed(why) {
  if (gps) return;
  $("#gpsInfo").innerHTML = `Location: GPS failed (${why}). <button id="gpsRetry">Retry GPS</button> or set it manually below (demo).`;
  $("#gpsRetry").onclick = locate;
  document.querySelector("details").open = true;
}
let pendingVoice = null;
locate();
$("#silk").onclick = () => setGps(12.9166, 77.6231, "demo: Silk Board");
["#lat", "#lon"].forEach((s) => $(s).onchange = () => {
  const a = parseFloat($("#lat").value), o = parseFloat($("#lon").value);
  if (!isNaN(a) && !isNaN(o)) setGps(a, o, "manual demo");
});

// --- voice: record, upload to /incident/voice ---
// Tap to start, tap again to send. (Hold-to-speak lost recordings: releasing during the first
// microphone permission prompt stopped nothing, and the recorder then never stopped.)
let rec = null, chunks = [], recStart = 0, recTimer = null, starting = false;
const MIC_ERR = { NotAllowedError: "microphone permission denied (allow it in the address bar)",
                  NotFoundError: "no microphone found", NotReadableError: "microphone in use by another app" };
async function startRec() {
  if (!window.isSecureContext) { $("#recInfo").textContent = "Microphone needs http://localhost:8000, please type."; return; }
  starting = true; $("#startErr").textContent = "";
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    rec = new MediaRecorder(stream); chunks = [];
    rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
    rec.onstop = () => {
      stream.getTracks().forEach((t) => t.stop()); clearInterval(recTimer);
      $("#rec").textContent = "🎤 Tap to speak";
      const secs = (Date.now() - recStart) / 1000;
      if (secs < 1 || !chunks.length) { $("#recInfo").textContent = "Too short, tap and speak for a few seconds."; return; }
      sendVoice(new Blob(chunks, { type: rec.mimeType }));
    };
    rec.start(250); recStart = Date.now();
    $("#rec").textContent = "⏹ Tap to send";
    recTimer = setInterval(() => { $("#recInfo").textContent = `Recording… ${Math.floor((Date.now() - recStart) / 1000)} s`; }, 250);
  } catch (e) { $("#recInfo").textContent = `Microphone unavailable: ${MIC_ERR[e.name] || e.message}. Please type.`; }
  finally { starting = false; }
}
$("#rec").textContent = "🎤 Tap to speak";
$("#rec").onclick = () => {
  if (starting) return;
  if (rec && rec.state === "recording") rec.stop(); else startRec();
};

async function sendVoice(blob) {
  if (!gps) {
    pendingVoice = blob;
    $("#recInfo").textContent = "Recording kept. Set the location (GPS or demo button below) and it is sent automatically.";
    document.querySelector("details").open = true; return;
  }
  $("#recInfo").textContent = "Transcribing…";
  const fd = new FormData();
  fd.append("audio", blob, "report.webm"); fd.append("lat", gps.lat); fd.append("lon", gps.lon); fd.append("language", lang);
  try { const r = await api("/incident/voice", { method: "POST", body: fd }); $("#recInfo").textContent = ""; startDialogue(r); }
  catch (e) { $("#recInfo").textContent = ""; $("#startErr").textContent = e.message; }
}

// --- text report ---
$("#send").onclick = async () => {
  $("#startErr").textContent = "";
  if (!gps) { $("#startErr").textContent = "Location needed first."; return; }
  const text = $("#text").value.trim();
  if (!text) { $("#startErr").textContent = "Please describe what happened."; return; }
  try { startDialogue(await api("/incident/text", { json: { text, gps, language: lang } })); }
  catch (e) { $("#startErr").textContent = e.message; }
};

// --- dialogue ---
function startDialogue(r) {
  incident = r.incident_id;
  $("#start").hidden = true; $("#dialogue").hidden = false;
  $("#iid").textContent = incident;
  $("#s3").textContent = st("s3");
  if (r.transcript) $("#transcript").textContent = `Heard: "${r.transcript}"`;
  showTurn(r);
}
function showTurn(r) {
  if (r.done) return finish(r);
  const q = r.question;
  $("#qtext").textContent = q.text;
  const free = FREE_TEXT.has(q.q_id);
  $("#taps").hidden = free; $("#free").hidden = !free;
  $("#answer").value = ""; if (free) $("#answer").focus();
  const items = firstTurn ? [{ key: "s3", text: st("s3") }] : [];
  firstTurn = false;
  say([...items, { key: QKEY[q.q_id], text: q.text }]);
}
async function sendAnswer(a) {
  $("#dlgErr").textContent = "";
  try { showTurn(await api(`/incident/${incident}/answer`, { json: { answer: a } })); }
  catch (e) { $("#dlgErr").textContent = e.message; }
}
document.querySelectorAll(".tap").forEach((b) => b.onclick = () => sendAnswer(b.dataset.a));
$("#sendAnswer").onclick = () => { const a = $("#answer").value.trim(); if (a) sendAnswer(a); };
$("#answer").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#sendAnswer").click(); });

async function finish(r) {
  $("#dialogue").hidden = true; $("#result").hidden = false;
  const inc = await api(`/incident/${incident}`);
  $("#sev").innerHTML = inc.risk ? sevBadge(inc.risk.severity_class) : "–";
  $("#model").textContent = inc.risk ? `(${inc.risk.model_version})` : "";
  $("#s1").textContent = st("s1");
  watchDispatch(inc);
  loadGuidance();
}

// S2 only once the dispatcher has actually dispatched (decision set), never before.
async function watchDispatch(inc) {
  while (!inc.decision) {
    await new Promise((ok) => setTimeout(ok, 5000));
    try { inc = await api(`/incident/${incident}`); } catch (e) { return; }
  }
  $("#s2").textContent = st("s2"); $("#s2").hidden = false;
  say([{ key: "s2", text: st("s2") }]);
}

// --- guidance: corpus text only, one step at a time, spoken by the browser ---
async function loadGuidance() {
  $("#guidance").hidden = false;
  $("#s4").textContent = st("s4");
  const g = await api(`/incident/${incident}/guidance`);
  steps = []; const srcs = new Map();
  if (g.status !== "ok") {
    $("#steps").innerHTML = `<div class="step">${esc(g.message)}</div>`;
    say([{ key: "s1", text: st("s1") }, { text: g.message, l: "en" }]);
    return;
  }
  let grounded = true;
  topics = [];
  for (const it of g.items) {
    const topic = TOPIC[it.problem] || it.problem.replace(/_/g, " ");
    topics.push({ name: topic, start: steps.length });
    if (it.status !== "ok") { steps.push({ text: it.message, ids: [], topic }); continue; }
    if (it.fully_grounded === false) grounded = false;
    for (const s of it.sentences) steps.push({ text: s.text, ids: s.chunk_ids, topic });
    for (const r of it.retrieved) srcs.set(r.chunk_id, r);
  }
  if (!steps.length) steps.push({ text: g.items.map((i) => i.message).join(" "), ids: [], topic: "" });
  $("#grounded").innerHTML = grounded ? '<span class="badge ok">grounded ✓</span>' : '<span class="badge warn">partly grounded</span>';
  $("#sources").innerHTML = "Sources: " + [...srcs.values()].map((r) => `${esc(r.chunk_id)} (${esc(r.publisher || "")})`).join("; ");
  stepIdx = 0; showStep([{ key: "s1", text: st("s1") }, { key: "s4", text: st("s4") }]);
  if (lang !== "en") $("#speakInfo").textContent = "Steps are in English (reviewed translations pending).";
}
// Topic per guidance item (problem ids from backend/rag/pipeline.py::queries_from_report), in the
// order the backend gives them: airway/breathing first, then bleeding, then the injury type.
const TOPIC = { cpr: "Not breathing normally: CPR", unresponsive_breathing: "Unresponsive, breathing: recovery position",
                breathing: "Breathing difficulty", bleeding: "Severe bleeding", road_accident: "Road accident",
                fall: "Fall / possible broken bone", burn: "Burn", cardiac_medical: "Chest pain", other: "General", report: "From your report" };
let topics = [];
function showStep(intro = []) {
  const s = steps[stepIdx];
  const t = topics.filter((x) => x.start <= stepIdx).pop() || { start: 0 };
  const end = (topics[topics.indexOf(t) + 1] || { start: steps.length }).start;
  const nav = topics.length > 1 ? `<div class="row" style="margin-bottom:6px">${topics.map((x, i) =>
    `<button class="topic${x === t ? " primary" : ""}" data-i="${i}">${i + 1}. ${esc(x.name)}</button>`).join("")}</div>` : "";
  $("#steps").innerHTML = nav +
    `<div class="muted">${esc(s.topic || "")}${s.topic ? " · " : ""}step ${stepIdx - t.start + 1} of ${end - t.start}</div>` +
    `<div class="step">${esc(s.text)}</div>` +
    (s.ids.length ? `<div class="source">from ${s.ids.map(esc).join(", ")}</div>` : "");
  document.querySelectorAll(".topic").forEach((b) => b.onclick = () => { stepIdx = topics[+b.dataset.i].start; showStep(); });
  $("#prev").disabled = stepIdx === 0; $("#next").disabled = stepIdx >= steps.length - 1;
  say([...intro, { text: s.text, l: "en" }]);
}
$("#prev").onclick = () => { stepIdx--; showStep(); };
$("#next").onclick = () => { stepIdx++; showStep(); };
$("#repeat").onclick = () => say([{ text: steps[stepIdx].text, l: "en" }]);

// --- speech: play items in order; {key} = native recording (falls back to the browser voice),
// {text, l} = browser voice. A new say() stops whatever is still playing.
let playing = null, gen = 0;
function stopSpeech() {
  gen++;
  if (playing) { playing.pause(); playing = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
async function say(items) {
  stopSpeech(); const g = gen;
  for (const it of items) { if (g !== gen) return; await sayOne(it); }
}
function sayOne(it) {
  if (!it.key) return speak(it.text, it.l);
  return new Promise((done) => {
    const a = new Audio(`/prompts/${it.key}_${lang}.mp3`);
    let fell = false;
    const fallback = () => { if (!fell) { fell = true; speak(it.text, lang).then(done); } };
    a.onended = done; a.onerror = fallback;
    playing = a; a.play().catch(fallback);
  });
}
function speak(text, l) {
  return new Promise((done) => {
    if (!("speechSynthesis" in window)) return done();
    const code = { en: "en-IN", hi: "hi-IN", kn: "kn-IN" }[l];
    const voice = speechSynthesis.getVoices().find((v) => v.lang === code || v.lang.startsWith(l));
    if (!voice && l !== "en") return done();   // no voice for this language on the device: text only
    const u = new SpeechSynthesisUtterance(text);
    u.lang = code; if (voice) u.voice = voice;
    u.onend = done; u.onerror = done;
    speechSynthesis.speak(u);
  });
}
</script>
</body>
</html>
